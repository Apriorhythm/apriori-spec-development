name: ci

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/run-tests.mjs
      - run: npm run verify
      - run: node bin/apriori.js check --self

  golden-path:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: pack and walk the README Quickstart with the packed tarball
        shell: bash
        run: |
          TGZ=$(npm pack --silent)
          node scripts/golden-path.mjs --packed "$TGZ"

  python-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pytest-tap
      - name: verify the Python example (specs bound via the TAP adapter)
        working-directory: examples/python-pytest
        shell: bash
        run: node ../../bin/apriori.js verify --specs apriori/specs --test-cmd "python run_tap.py"
