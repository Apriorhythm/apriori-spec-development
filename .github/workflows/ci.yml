name: ci

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: npm run verify
      - run: node bin/apriori.js check --self

  golden-path:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: pack and walk the README Quickstart with the packed tarball
        shell: bash
        run: |
          TGZ=$(npm pack --silent)
          node scripts/golden-path.mjs --packed "$TGZ"
