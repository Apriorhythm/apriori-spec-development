<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快速投票 — 创建</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>创建一个快速投票</h1>
  <form id="create-form" class="card">
    <label for="title">标题</label>
    <input type="text" id="title" maxlength="120" placeholder="例如：周五团建去哪？" required>
    <label>选项（至少 2 个，最多 20 个）</label>
    <div id="options">
      <div class="option-row"><input type="text" maxlength="80" placeholder="选项 1"></div>
      <div class="option-row"><input type="text" maxlength="80" placeholder="选项 2"></div>
    </div>
    <p><button type="button" class="secondary" id="add-option">+ 添加选项</button></p>
    <p><button type="submit">生成投票</button></p>
    <p class="error" id="error" hidden></p>
  </form>
  <div class="card links" id="result" hidden>
    <p><strong>投票链接</strong>（发到群里）：<br><a id="vote-link" href=""></a></p>
    <p><strong>管理链接</strong>（只留给自己，用于关闭投票）：<br><a id="admin-link" href=""></a></p>
  </div>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
